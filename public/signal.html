<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXON Signal</title>
<meta name="description" content="Ask anything. Answers come from memories the owner chose to share, sealed on Robinhood Chain.">
<meta property="og:title" content="AXON Signal">
<meta property="og:description" content="Ask anything. Answers come from memories the owner chose to share, sealed on Robinhood Chain.">
<meta property="og:image" content="/pp.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { min-height: 100vh; }
  .sg-top { display: flex; justify-content: space-between; align-items: center; padding: 18px var(--gutter); }
  .sg { display: grid; grid-template-columns: minmax(300px, 0.9fr) 64px minmax(0, 1.3fr); gap: 0 28px; min-height: calc(100vh - 76px); padding: 0 var(--gutter); }
  .who-col { padding: 9vh 0 6vh; position: sticky; top: 0; align-self: start; }
  .who-col h1 { font: 300 clamp(54px, 6.4vw, 104px)/0.92 var(--serif); letter-spacing: -0.02em; margin: 0 0 14px; word-break: break-word; }
  .who-col .at { color: var(--ash); font-size: 15px; margin: 0 0 26px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 12.5px; font-weight: 500; color: var(--night); background: var(--ion); border-radius: 999px; padding: 4px 10px; box-shadow: 0 0 18px rgba(156, 207, 255, 0.45); }
  .who-col .bio { font-size: 19px; color: #d8d1c3; max-width: 34ch; margin: 0 0 34px; }
  .who-col .facts { color: var(--ash); font-size: 14.5px; max-width: 40ch; line-height: 1.65; }
  .who-col .facts b { color: var(--vellum); font-weight: 500; }
  .wire { position: relative; }
  .wire::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: linear-gradient(to bottom, transparent, var(--rule-2) 10%, var(--rule-2) 90%, transparent); }
  .wire i { position: absolute; left: 50%; width: 9px; height: 70px; margin-left: -4.5px; bottom: 10%; border-radius: 6px; opacity: 0; background: radial-gradient(closest-side, rgba(220, 240, 255, 1), rgba(156, 207, 255, 0.4) 50%, transparent); }
  .wire.live i { animation: travel 1.3s cubic-bezier(.5, 0, .3, 1) infinite; }
  @keyframes travel { 0% { bottom: 8%; opacity: 0; } 15% { opacity: 1; } 100% { bottom: 88%; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .wire.live i { animation: none; opacity: 1; bottom: 50%; } }
  .talk { display: flex; flex-direction: column; padding: 9vh 0 30px; min-height: calc(100vh - 76px); }
  .thread { flex: 1; display: flex; flex-direction: column; gap: 34px; padding-bottom: 30px; }
  .q { color: var(--ash); font-size: 15.5px; max-width: 60ch; }
  .q::before { content: "Asked"; display: block; font-size: 12.5px; color: #6f7785; margin-bottom: 4px; }
  .a { font: 400 clamp(21px, 1.9vw, 26px)/1.42 var(--serif); color: var(--vellum); max-width: 34em; white-space: pre-wrap; }
  .a.err { font: 400 15.5px/1.6 var(--sans); color: var(--danger); }
  .a small { display: block; font: 400 13px/1.5 var(--sans); color: #6f7785; margin-top: 10px; }
  .empty-talk { color: var(--ash); max-width: 46ch; }
  .empty-talk p { margin: 0 0 22px; font-size: 16px; }
  .sugg { display: flex; flex-wrap: wrap; gap: 10px; }
  .sugg button { font: 400 14.5px var(--sans); color: var(--vellum); background: var(--deep); border: 1px solid var(--rule); border-radius: 999px; padding: 10px 15px; cursor: pointer; }
  .sugg button:hover { border-color: var(--vellum); }
  .ask { position: sticky; bottom: 18px; display: flex; gap: 10px; align-items: flex-end; background: var(--deep); border: 1px solid var(--rule-2); border-radius: 20px; padding: 8px 8px 8px 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
  .ask textarea { flex: 1; background: none; border: 0; color: var(--vellum); font: 400 16px/1.5 var(--sans); resize: none; padding: 9px 0; max-height: 140px; }
  .ask textarea:focus { outline: none; }
  .ask:focus-within { border-color: var(--vellum); }
  .missing { grid-column: 1 / -1; padding: 16vh 0; }
  .missing h1 { font: 300 clamp(44px, 5vw, 80px)/1 var(--serif); margin: 0 0 18px; }
  .missing p { color: var(--ash); margin: 0 0 30px; }
  @media (max-width: 900px) {
    .sg { grid-template-columns: 1fr; }
    .who-col { position: static; padding: 4vh 0 0; }
    .wire { display: none; }
    .talk { padding-top: 34px; min-height: auto; }
  }
</style>
</head>
<body>
<header class="sg-top">
  <a class="brand" href="/"><img src="/pp.png" alt=""><span>AXON</span></a>
  <a class="btn ghost small" href="/app">Create your Signal</a>
</header>
<main class="sg" id="sg">
  <section class="who-col" id="who" aria-live="polite"></section>
  <div class="wire" id="wire" aria-hidden="true"><i></i></div>
  <section class="talk">
    <div class="thread" id="thread"></div>
    <form class="ask" id="ask">
      <textarea id="q" rows="1" maxlength="500" placeholder="Ask anything" aria-label="Your question"></textarea>
      <button class="btn small" type="submit" id="send">Ask</button>
    </form>
  </section>
</main>
<script src="/config.js"></script>
<script src="/core.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s), esc = AX.esc;
  const handle = (location.pathname.split('/')[2] || '').toLowerCase();
  const history = [];
  let S = null, busy = false;

  function missing() {
    $('#sg').innerHTML = `<div class="missing"><h1>No Signal here yet.</h1><p>Nobody published a Signal named @${esc(handle)}. It could be yours.</p><a class="btn" href="/app">Create your Signal</a></div>`;
  }
  AX.api('/api/s/' + encodeURIComponent(handle)).then((s) => {
    S = s;
    const first = s.name.split(' ')[0];
    $('#who').innerHTML = `<h1>${esc(s.name)}</h1>
      <div class="at"><span>@${esc(s.handle)}</span>${s.holder ? '<span class="badge">$AXON holder</span>' : ''}</div>
      ${s.bio ? `<p class="bio">${esc(s.bio)}</p>` : ''}
      <p class="facts">This is ${esc(first)}'s Signal. It answers from <b>${s.items} ${s.items === 1 ? 'memory' : 'memories'}</b> that ${esc(first)} chose to share (${s.folders.map(esc).join(', ')}). ${s.asks ? `<b>${s.asks.toLocaleString('en-US')}</b> ${s.asks === 1 ? 'question' : 'questions'} answered so far, each one sealed on ${AX.cfg.CHAIN_NAME}.` : `Every question is sealed on ${AX.cfg.CHAIN_NAME}.`}</p>`;
    $('#q').placeholder = `Ask ${first} anything`;
    const sugg = s.handle === 'axon' ? ['What is AXON?', 'Can anyone read my vault?', 'How do I connect Claude?'] : ['What are you working on right now?', 'How do you like to work?', 'What should I know about you?'];
    $('#thread').innerHTML = `<div class="empty-talk" id="empty"><p>Start with one of these, or write your own question.</p><div class="sugg">${sugg.map((q) => `<button type="button">${esc(q)}</button>`).join('')}</div></div>`;
    $('#thread').querySelectorAll('.sugg button').forEach((b) => (b.onclick = () => { $('#q').value = b.textContent; send(); }));
  }).catch(missing);

  const grow = () => { const t = $('#q'); t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; };
  $('#q').addEventListener('input', grow);
  $('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('#ask').addEventListener('submit', (e) => { e.preventDefault(); send(); });

  async function send() {
    const q = $('#q').value.trim();
    if (!q || busy || !S) return;
    busy = true; $('#send').disabled = true; $('#wire').classList.add('live');
    $('#empty')?.remove();
    const th = $('#thread');
    th.insertAdjacentHTML('beforeend', `<div class="q">${esc(q)}</div><div class="a" aria-busy="true"><small>The signal is travelling through ${esc(S.name.split(' ')[0])}'s memory.</small></div>`);
    const out = th.lastElementChild;
    $('#q').value = ''; grow();
    out.scrollIntoView({ behavior: 'smooth', block: 'end' });
    try {
      const r = await AX.api(`/api/s/${encodeURIComponent(handle)}/ask`, { method: 'POST', body: { q, history } });
      out.removeAttribute('aria-busy');
      out.innerHTML = `${esc(r.answer)}<small>Answered from ${r.used} ${r.used === 1 ? 'memory' : 'memories'}. This read is logged and sealed within the hour.</small>`;
      history.push({ role: 'user', content: q }, { role: 'assistant', content: r.answer });
      while (history.length > 6) history.shift();
    } catch (e) {
      out.className = 'a err'; out.textContent = e.message;
    }
    busy = false; $('#send').disabled = false; $('#wire').classList.remove('live');
    $('#q').focus();
  }
})();
</script>
</body>
</html>
